# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🎛️ The values · 🧽 Stage 2 · Cleaning
#  Lecture: Image Preprocessing Methods · Thu 24.09
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  README.md       why this stage exists, and what to try
#  action.yaml     you are here: the values cleaning.py runs with
#  cleaning.py     the code: ▶ it, read build/cleaning/report.md and before_after.png
#
#  Every frame goes through a denoising filter: each pixel is replaced by a
#  combination of its neighbours. The art is removing the noise without
#  removing the drop.
#
#  CI imports this folder as one stage:  - uses: ./2_cleaning
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
name: "2 · Cleaning — denoise"
description: Remove sensor noise and dead pixels from every frame.

inputs:
  # ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
  #    🎛️  TINKER ZONE — the values: change one, ▶ cleaning.py, read the report
  # ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

  # │ gaussian
  # │ 🏛️ 1809 · Carl Friedrich Gauss — the bell curve, invented to average out
  # │    measurement errors in the orbits of planets. Same job, 200 years later:
  # │        G(x, y) = e^(−(x² + y²) / 2σ²) / 2πσ²
  # │    near neighbours weigh more than far ones, so random noise cancels out.
  # │ ⚡ cv2.GaussianBlur splits the 2-D bell into a row pass and a column pass
  # │    (k² → 2k multiplications per pixel) and runs both with SIMD in 16-bit
  # │    fixed-point maths: a run of pixels per CPU instruction.
  # │
  # │ median
  # │ 🏛️ 1774 · Pierre-Simon Laplace — the median is the value with the smallest
  # │    total absolute error, and one crazy value can't drag it away.
  # │    1970s · John Tukey turned it into a smoothing filter.
  # │ ⚡ cv2.medianBlur sorts 3×3 and 5×5 windows with a SIMD sorting network;
  # │    bigger windows switch to a running histogram whose cost barely grows
  # │    with the window (Perreault & Hébert, 2007).
  # │
  # │ bilateral  🏛️ 1998 · Tomasi & Manduchi — Gauss twice: close in space AND
  # │            close in brightness, so edges survive the smoothing.
  # │ nlmeans    🏛️ 2005 · Buades, Coll & Morel — average similar patches from
  # │            anywhere in the frame, not just the neighbours.
  # │
  # │ 🎮 On an NVIDIA GPU the same filters exist as cv2.cuda.createGaussianFilter
  # │    and cv2.cuda.createMedianFilter, one thread per pixel on thousands of
  # │    CUDA cores. This runner has no GPU: the job summary shows the CPU's
  # │    milliseconds per frame. Gauss did his sums by hand, for weeks.
  method:
    description: "none | gaussian | median | bilateral | nlmeans — or a list like [median, gaussian]"
    default: "median"
  kernel:
    description: "Odd window size: 3, 5, 7 … bigger = smoother = blurrier"
    default: "3"
  sigma:
    description: "Width σ of Gauss's bell; 0 derives it from the kernel size"
    default: "0"
  bilateral_diameter:
    description: "Neighbourhood diameter for the bilateral filter"
    default: "7"
  bilateral_sigma_color:
    description: "How different in brightness a neighbour may be and still count"
    default: "50"
  bilateral_sigma_space:
    description: "How far away a neighbour may be and still count"
    default: "50"
  nlmeans_h:
    description: "Filter strength for non-local means"
    default: "10"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━ end of TINKER ZONE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  # ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
  #    🚦 GATE ZONE — fail one and the pipeline stops here (null switches it off)
  # ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
  # │ How do we measure noise without a clean original?
  # │ 🏛️ 1780s · Laplace — the Laplacian ∇²f = ∂²f/∂x² + ∂²f/∂y² says how much a
  # │    point differs from its surroundings. 1996 · John Immerkær subtracts two
  # │    Laplacians so that smooth structure cancels and only the noise is left.
  # │ ⚡ One cv2.filter2D pass with a 3×3 kernel: [1 −2 1; −2 4 −2; 1 −2 1].
  gate_max_noise:
    description: "Estimated noise σ after cleaning must stay below this"
    default: "4.0"

runs:
  using: composite
  steps:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━ 🔒 PLUMBING — no need to touch ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - uses: ./.github/actions/stage-setup
      with:
        stage: cleaning
        previous: digital_data
    - name: 🧽 Cleaning
      shell: bash
      env:
        CV_STAGE: cleaning
        CV_KNOBS: ${{ toJSON(inputs) }}
      run: python 2_cleaning/cleaning.py
    - uses: ./.github/actions/stage-publish
      if: always()
      with:
        stage: cleaning
