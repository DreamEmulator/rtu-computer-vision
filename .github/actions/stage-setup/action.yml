# 🔒 Shared plumbing for every stage: announce the stage, set up Python, fetch the previous stage's output.
name: Stage setup
description: Webhook stage.started, Python + dependencies, and the output of the previous stage
inputs:
  stage:
    description: Stage key (see stages/registry.py)
    required: true
  previous:
    description: Artifact of the previous stage, downloaded into build/<name>; "*" downloads every stage
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: 📡 Tell the web page this stage started
      shell: bash
      run: python3 -m stages.webhook started --stage ${{ inputs.stage }}
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install dependencies
      shell: bash
      run: pip install -r requirements.txt
    - name: Fetch output of ${{ inputs.previous }}
      if: inputs.previous != '' && inputs.previous != '*'
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.previous }}
        path: build/${{ inputs.previous }}
    - name: Fetch the output of every stage that ran
      if: inputs.previous == '*'
      uses: actions/download-artifact@v4
      with:
        path: build
