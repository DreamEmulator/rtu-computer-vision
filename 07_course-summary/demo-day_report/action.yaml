# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ## How?    🎤 CI Stage 7 · Demo Day — report
#  Topic of the week: Course Summary · lecture Tue 13.10
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Why?  → ../README.md          What?  → ../Todo_Demo-Day.md
#
#  Collects every stage's metrics, gates, previews and your snap's journey into
#  one page, sends pipeline.finished to the sdux.tech page, and (if Pages is on)
#  publishes the report as a website. Runs even when a gate failed.
#
#  Imported by .github/workflows/pipeline.yml:
#      - uses: ./07_course-summary/demo-day_report
#  Runs: stages/s7_demo_day.py
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
name: "7 · Demo Day — report"
description: Build the Demo Day report from every stage that ran.

inputs:
  # ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
  #    🎛️  TINKER ZONE — it's your startup: name it, pitch it
  # ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
  project_name:
    description: "Your startup's name, the title of the report"
    default: "Drip Detector"
  pitch:
    description: "One sentence an investor remembers"
    default: "A clip-on camera that tells the nurse when an IV drip stops or runs dry."
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━ end of TINKER ZONE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

runs:
  using: composite
  steps:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━ 🔒 PLUMBING — no need to touch ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - uses: ./.github/actions/stage-setup
      with:
        stage: demo_day
        previous: "*"
    - name: 🎤 Demo Day
      shell: bash
      env:
        CV_STAGE: demo_day
        CV_KNOBS: ${{ toJSON(inputs) }}
      run: python -m stages.s7_demo_day
    - uses: ./.github/actions/stage-publish
      if: always()
      with:
        stage: demo_day
    - name: Prepare the website
      uses: actions/upload-pages-artifact@v3
      with:
        path: build/demo_day
